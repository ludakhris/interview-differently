name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  deploy-web:
    name: Deploy Web (Vercel)
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  railway-config:
    name: Apply Railway config (.railway/railway.ts)
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The railway SDK (root devDependency) evaluates .railway/railway.ts.
      - run: npm install
      - run: npm install -g @railway/cli@5.63.1
      - run: railway config plan --verbose
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # No --confirm-destructive: a plan that deletes anything fails here.
      - run: railway config apply --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-api:
    name: Deploy API (Railway)
    needs: [ci, railway-config]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # A normal deploy takes ~2 min; `railway up` has hung for hours before.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Railway rebuilds the API only when a file in its watch paths changed
      # (.railway/railway.ts: apps/api/** and packages/types/**; keep this list in
      # step with that one). A push that changed one waits for the build (--ci),
      # so a failed build fails this job; any other push uploads nothing, since
      # Railway would build nothing and --ci would wait until the timeout. A
      # re-run, or a push whose previous commit is unknown, uploads without waiting.
      - name: Did this push change the API?
        id: api
        run: |
          before='${{ github.event.before }}'
          if [ "${{ github.run_attempt }}" != "1" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "deploy=detach" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(apps/api/|packages/types/)'; then
            echo "deploy=wait" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=skip" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.api.outputs.deploy != 'skip'
        run: npm install -g @railway/cli
      - if: steps.api.outputs.deploy == 'wait'
        run: railway up --service interview-differently --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - if: steps.api.outputs.deploy == 'detach'
        run: railway up --service interview-differently --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
