name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run test:scripts

  deploy-web:
    name: Deploy Web (Vercel)
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  railway-config:
    name: Apply Railway config (.railway/railway.ts)
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The railway SDK (root devDependency) evaluates .railway/railway.ts.
      - run: npm install
      - run: npm install -g @railway/cli@5.63.1
      - run: railway config plan --verbose
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # No --confirm-destructive: a plan that deletes anything fails here.
      - run: railway config apply --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-api:
    name: Deploy API (Railway)
    needs: [ci, railway-config]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # A normal deploy takes ~2 min; `railway up` has hung for hours before.
    timeout-minutes: 15
    # actions: read lets the API check find the last main run that passed.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Railway rebuilds the API only when a file in its watch paths changed
      # (.railway/railway.ts: apps/api/** and packages/types/**; keep this list in
      # step with that one). A push that changed one waits for the build (--ci),
      # so a failed build fails this job. The API is compared with the last main
      # commit whose CI run passed, not only with the previous push: a push whose
      # deploy failed or was skipped (say, the config step refused) leaves its API
      # changes undeployed, and the next push, even a config-only one, sends them
      # (without waiting, as this push changed no watched file). Any other push
      # uploads nothing, since Railway would build nothing and --ci would wait until
      # the timeout. A re-run, or a push with no known base, uploads without waiting.
      - name: Is there an API change to deploy?
        id: api
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          watched='^(apps/api/|packages/types/)'
          before='${{ github.event.before }}'
          green=$(gh run list --repo '${{ github.repository }}' --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json headSha -q '.[0].headSha' || true)
          known() { [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          if [ "${{ github.run_attempt }}" != "1" ] || ! known "$before" || ! known "$green"; then
            echo "deploy=detach" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -qE "$watched"; then
            echo "deploy=wait" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$green" "${{ github.sha }}" | grep -qE "$watched"; then
            echo "deploy=detach" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=skip" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.api.outputs.deploy != 'skip'
        run: npm install -g @railway/cli
      - if: steps.api.outputs.deploy == 'wait'
        run: railway up --service interview-differently --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - if: steps.api.outputs.deploy == 'detach'
        run: railway up --service interview-differently --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # Applies ops/monitoring.ts to Better Stack (monitors and the status page; docs/monitoring.md). Runs on every push
  # to main once the API deploy job has passed, so a push that changed only the monitoring list syncs too (that job
  # passes without uploading when no API file changed). Without the BETTERSTACK_API_TOKEN secret the script prints
  # that it skipped and exits 0; nothing depends on this job.
  betterstack:
    name: Sync Better Stack monitoring (ops/monitoring.ts)
    needs: [deploy-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # No npm install: the script uses only Node's own modules.
      - run: npm run betterstack:sync
        env:
          BETTERSTACK_API_TOKEN: ${{ secrets.BETTERSTACK_API_TOKEN }}
